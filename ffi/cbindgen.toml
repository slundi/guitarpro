language = "C"
include_guard = "GUITARPRO_FFI_H"
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "both"
# Emit `size_t` for `usize` rather than cbindgen's default `uintptr_t`: these
# are byte counts, not addresses.
usize_is_size_t = true
# Suppress the default include block so the list below is the whole set.
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

header = """
/* guitarpro-ffi — C ABI for the `guitarpro` score library.
 *
 * Generated by cbindgen from ffi/src. Do not edit by hand: `cargo build -p
 * guitarpro-ffi` regenerates this file in place whenever the Rust surface
 * changes.
 */"""

autogen_warning = "/* Warning: this file is auto-generated. Manual edits will be overwritten. */"

[parse]
parse_deps = false

[export]
include = ["GpioFormat", "GpioBuffer", "GpioScore"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
