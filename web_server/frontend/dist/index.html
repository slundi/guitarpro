<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guitar Score Viewer</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        background: #1a1a1a;
        color: #e0e0e0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Toolbar ────────────────────────────────────────────── */
      #toolbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        background: #242424;
        border-bottom: 1px solid #333;
        overflow-x: auto;
        white-space: nowrap;
      }

      #score-title {
        font-weight: 600;
        font-size: 0.88rem;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sep { flex: 1; min-width: 4px; }

      /* ── Buttons ────────────────────────────────────────────── */
      button, .file-btn {
        padding: 3px 8px;
        border: 1px solid #444;
        border-radius: 3px;
        background: transparent;
        color: #ccc;
        cursor: pointer;
        font-size: 0.8rem;
        line-height: 1.5;
        user-select: none;
        white-space: nowrap;
      }

      button:hover, .file-btn:hover {
        background: #2e2e2e;
        border-color: #666;
        color: #e0e0e0;
      }

      button.active { background: #3a3a3a; border-color: #888; color: #fff; }

      .btn-group { display: flex; }
      .btn-group button { border-radius: 0; margin-left: -1px; }
      .btn-group button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
      .btn-group button:last-child  { border-radius: 0 3px 3px 0; }

      /* ── Zoom ───────────────────────────────────────────────── */
      .zoom-wrap {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.78rem;
        color: #999;
      }

      #zoom-slider { width: 72px; accent-color: #888; cursor: pointer; }
      #zoom-value  { min-width: 3.2ch; color: #ccc; }

      /* ── Status bar ─────────────────────────────────────────── */
      #status-bar { font-size: 0.74rem; color: #666; min-width: 7ch; }

      /* ── File input ─────────────────────────────────────────── */
      #file-input { display: none; }

      .file-btn { display: inline-flex; align-items: center; gap: 4px; }

      /* ── Main area ──────────────────────────────────────────── */
      #main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── Sidebar ────────────────────────────────────────────── */
      #sidebar {
        width: 0;
        flex-shrink: 0;
        overflow: hidden;
        background: #1e1e1e;
        border-right: 1px solid #2a2a2a;
        transition: width 0.2s ease;
        display: flex;
        flex-direction: column;
      }

      #sidebar.open { width: 180px; overflow-y: auto; }

      .sidebar-label {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #555;
        padding: 10px 10px 4px;
        flex-shrink: 0;
      }

      #track-list { flex-shrink: 0; }

      .track-item {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 0.82rem;
        color: #bbb;
      }

      .track-item:hover { background: #252525; color: #e0e0e0; }
      .track-item input[type="checkbox"] { accent-color: #888; cursor: pointer; flex-shrink: 0; }

      .sidebar-divider { height: 1px; background: #2a2a2a; margin: 6px 0; flex-shrink: 0; }

      .track-mode-group {
        padding: 2px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex-shrink: 0;
      }

      .track-mode-group label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 0.82rem;
        color: #bbb;
        cursor: pointer;
      }

      .track-mode-group input[type="radio"] { accent-color: #888; cursor: pointer; flex-shrink: 0; }

      /* ── Score container ────────────────────────────────────── */
      #score-container {
        flex: 1;
        overflow: auto;
        position: relative;
      }

      #score-container.drag-over { outline: 2px dashed #555; outline-offset: -6px; }

      /* ── Placeholder ────────────────────────────────────────── */
      #placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        gap: 8px;
        color: #555;
        pointer-events: none;
      }

      #placeholder p     { font-size: 1rem; }
      #placeholder small { font-size: 0.78rem; color: #444; }

      /* ── Repeats overlay ────────────────────────────────────── */
      #repeats-overlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: visible;
        z-index: 10;
      }

      /* ── Fingering overlay ──────────────────────────────────── */
      #fingering-overlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: visible;
        z-index: 11;
      }

      /* ── Form legend strip ──────────────────────────────────── */
      #form-legend {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #1a1a1acc;
        backdrop-filter: blur(4px);
        padding: 4px 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #333;
      }

      .form-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 7px 2px;
        border-radius: 3px;
        font-size: 0.74rem;
        font-weight: 600;
        color: #fff;
        cursor: default;
        white-space: nowrap;
      }

      .form-badge .badge-bars {
        font-weight: 400;
        opacity: 0.85;
        font-size: 0.68rem;
      }

      /* ── Form overlay ───────────────────────────────────────── */
      #form-overlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: visible;
        z-index: 9;
      }

      /* ── Form sidebar section ───────────────────────────────── */
      #form-info {
        padding: 0 10px 4px;
        font-size: 0.78rem;
        color: #999;
        flex-shrink: 0;
      }

      .form-section-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
        font-size: 0.78rem;
        color: #bbb;
      }

      .form-swatch {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      #form-track-select-wrap {
        padding: 2px 10px 6px;
        flex-shrink: 0;
      }

      #form-track-select {
        width: 100%;
        background: #242424;
        color: #ccc;
        border: 1px solid #444;
        border-radius: 3px;
        padding: 2px 4px;
        font-size: 0.78rem;
      }

      /* ── Repeats sidebar section ─────────────────────────────── */
      #repeats-info {
        padding: 0 10px 6px;
        font-size: 0.78rem;
        color: #999;
        flex-shrink: 0;
      }

      .repeat-block-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
        font-size: 0.78rem;
        color: #bbb;
      }

      .repeat-swatch {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      #expand-sequence-btn {
        display: none;
        margin: 4px 10px 2px;
        width: calc(100% - 20px);
        font-size: 0.78rem;
      }

      #sequence-list {
        display: none;
        padding: 4px 10px 8px;
        font-size: 0.74rem;
        color: #888;
        line-height: 1.6;
        word-break: break-all;
        flex-shrink: 0;
      }

      /* ── Print ──────────────────────────────────────────────── */
      @media print {
        #toolbar         { display: none !important; }
        #sidebar         { display: none !important; }
        #score-container { overflow: visible; }
        #repeats-overlay   { display: none !important; }
        #form-overlay      { display: none !important; }
        #form-legend       { display: none !important; }
        #fingering-overlay { display: none !important; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-nJDFriZz.js"></script>
  </head>
  <body>
    <!-- Toolbar -->
    <div id="toolbar">
      <button id="sidebar-toggle">Tracks ›</button>

      <label class="file-btn" title="Open a Guitar Pro file">
        Open file
        <input type="file" id="file-input" accept=".gp3,.gp4,.gp5,.gp,.gpx">
      </label>

      <span id="score-title">Guitar Score Viewer</span>

      <div class="sep"></div>

      <div class="btn-group">
        <button class="mode-btn active" data-mode="notation-tab" title="Notation + Tab">N+T</button>
        <button class="mode-btn"        data-mode="notation"     title="Notation only">Notation</button>
        <button class="mode-btn"        data-mode="tab"          title="Tab only">Tab</button>
      </div>

      <div class="btn-group">
        <button class="layout-btn active" data-layout="page"       title="Page layout">Page</button>
        <button class="layout-btn"        data-layout="horizontal" title="Horizontal layout">Horiz</button>
      </div>

      <div class="zoom-wrap">
        Zoom
        <input type="range" id="zoom-slider" min="50" max="200" value="100" step="10">
        <output id="zoom-value">100%</output>
      </div>

      <button id="repeats-btn" title="Toggle repeat structure overlay">Repeats</button>
      <button id="form-btn"    title="Toggle form sections overlay">Form</button>
      <button id="fing-btn"    title="Toggle fingering annotations">Fingering</button>

      <button id="print-btn" title="Print score">Print</button>

      <span id="status-bar"></span>
    </div>

    <!-- Main -->
    <div id="main">
      <aside id="sidebar">
        <div class="sidebar-label">Tracks</div>
        <div id="track-list"></div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Selection</div>
        <div class="track-mode-group">
          <label>
            <input type="radio" name="track-mode" value="all" checked>
            All tracks
          </label>
          <label>
            <input type="radio" name="track-mode" value="current">
            Current track only
          </label>
        </div>

        <div class="sidebar-divider" id="repeats-divider" style="display:none"></div>
        <div class="sidebar-label" id="repeats-label" style="display:none">Repeats</div>
        <div id="repeats-info"></div>
        <button id="expand-sequence-btn">Show sequence</button>
        <div id="sequence-list"></div>

        <div class="sidebar-divider" id="form-divider" style="display:none"></div>
        <div class="sidebar-label" id="form-sidebar-label" style="display:none">Form</div>
        <div id="form-track-select-wrap" style="display:none">
          <select id="form-track-select"></select>
        </div>
        <div id="form-info"></div>

        <div class="sidebar-divider" id="fing-divider" style="display:none"></div>
        <div class="sidebar-label" id="fing-label" style="display:none">Fingering</div>
        <div id="fing-info"></div>
      </aside>

      <div id="score-container">
        <div id="placeholder">
          <p>Drop a file here or click Open file</p>
          <small>Supports GP3 · GP4 · GP5 · GP · GPX</small>
        </div>
        <div id="form-legend" style="display:none"></div>
        <div id="alphatab"></div>
      </div>
    </div>

  </body>
</html>
