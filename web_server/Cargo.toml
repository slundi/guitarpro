[package]
name = "web_server"
version = "0.1.0"
authors = ["slundi"]
edition = "2024"
description = "Web-based score viewer and analysis tool"
repository = "https://gitlab.com/slundi/guitar-io"
license = "MIT"

[[bin]]
name = "score_server"
path = "src/main.rs"

[features]
embed = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio-stream = "0.1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip"] }
argh = "0.1"
open = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml-span = "0.7"
thiserror = "2"
guitarpro = { path = "../guitarpro" }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
